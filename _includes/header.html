<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Sierra Stems home">Sierra <span>Stems</span></a>
    <nav class="nav" id="site-nav" aria-label="Main">
      {%- assign links = "Florists:/availability/,DIY weddings:/diy/,Sourcing:/sourcing/,Terms:/terms/,Contact:/contact/" | split: "," -%}
      {%- for l in links -%}
        {%- assign parts = l | split: ":" -%}
        <a href="{{ parts[1] | relative_url }}"{% if page.url == parts[1] %} aria-current="page"{% endif %}>{{ parts[0] }}</a>
      {%- endfor -%}
    </nav>
    <a class="order-link" href="{{ '/order/' | relative_url }}"{% if page.url == '/order/' %} aria-current="page"{% endif %}>
      Order <span class="order-count" data-cart-count hidden>0</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Menu</span><span class="bars" aria-hidden="true"></span>
    </button>
  </div>
</header>
